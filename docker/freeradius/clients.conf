client rofa-router {
    ipaddr    = 0.0.0.0/0
    secret    = "@RADIUS_SECRET@"
    require_message_authenticator = yes
    limit {
        max_connections = 64
        lifetime = 0
        idle_timeout = 30
    }
}

client docker-network {
    ipaddr    = 172.19.0.0/24
    secret    = "@RADIUS_SECRET@"
    require_message_authenticator = yes
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

client localhost {
    ipaddr    = 127.0.0.1
    secret    = "@RADIUS_SECRET@"
    require_message_authenticator = yes
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}
