; Production PHP overrides (loaded after the stock php.ini, before config.php's
; per-request ini_set calls).

expose_php = Off

; Errors go to stderr -> `docker logs` (php-fpm's docker.conf already sets
; error_log=/proc/self/fd/2 and catch_workers_output=yes for the pool).
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
display_startup_errors = Off

memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Uploads: invoices/images/receipts.
post_max_size = 32M
upload_max_filesize = 32M

; PHP does not read the TZ environment variable — pin it explicitly.
; Keep in sync with MySQL (both UTC) and the application "timezone" admin
; setting, which only affects display formatting.
date.timezone = UTC

; Session cookie hardening (same-origin portal flows are unaffected).
session.cookie_httponly = 1
session.cookie_samesite = Lax
