# Production nginx site for PHPNuxBill.
# Differences from the dev config: logs to stdout/stderr (docker log drivers),
# hidden version tokens, request-size limits for uploads, gzip, and an extra
# deny rule for deploy artifacts.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    server_tokens off;

    # `docker logs rofa-phpnuxbill` shows the full access/error stream.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }

    # Never expose git/env/config internals or deploy-time artifacts.
    location ~ /(\.git|\.env|config\.php|docker-compose|staging-export|test_mpesa) {
        deny all;
    }
}
